extends: default

page:
  layout: portrait
  margin: [25.4mm, 25.4mm, 25.4mm, 25.4mm]
  size: A4
  numbering:
    start-at: body
base:
  font-color: #333333
  font-family: Helvetica
  font-size: 11
  line-height: 1.5
  align: justify
list:
  indent: 30
  item-spacing: 4
  margin-top: 0
  margin-bottom: 6
heading:
  font-family: Helvetica
  font-style: bold
  font-color: #1a1a1a
  h1-font-size: 24
  h2:
    font-size: 18
    break-before: always
  h3-font-size: 14
  h4-font-size: 13
  h5:
    font-size: 12
    margin-top: 6
  h6:
    font-size: 11
    margin-top: 0
    margin-left: 12
  margin-top: 18
  margin-bottom: 6
codespan:
  font-color: #333333
quote:
  font-size: 11
header:
  height: 15mm
  padding: [10mm, 0mm, 1mm, 0mm]
  border-width: 0.5
  border-color: #999999
  recto:
    right:
      content: '{document-title}'
  verso:
    left:
      content: '{document-title}'
footer:
  height: 15mm
  border-width: 0.5
  border-color: #999999
  text-transform: uppercase
  recto:
    right:
      content: '{page-number}'
  verso:
    right:
      content: $footer-recto-right-content
    left:
      content: ''
title-page: false
cover:
  front:
    image: cover-page.pdf
