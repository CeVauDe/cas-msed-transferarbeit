extends: default

font:
  catalog:
    merge: true
    DejaVuSans:
      normal: /usr/share/fonts/dejavu/DejaVuSans.ttf
      bold: /usr/share/fonts/dejavu/DejaVuSans-Bold.ttf
      italic: /usr/share/fonts/dejavu/DejaVuSans-Oblique.ttf
      bold_italic: /usr/share/fonts/dejavu/DejaVuSans-BoldOblique.ttf
  fallbacks:
    - DejaVuSans

page:
  layout: portrait
  margin: [25.4mm, 25.4mm, 25.4mm, 25.4mm]
  size: A4
  numbering:
    start-at: body
base:
  font-color: #000000
  font-family: Helvetica
  font-size: 11
  line-height: 1.5
  align: justify
caption:
  font-color: #666666
  font-size: 9
  font-style: italic
list:
  indent: 30
  item-spacing: 4
  margin-top: 0
  margin-bottom: 6
heading:
  font-family: Helvetica
  font-style: bold
  h1-font-size: 24
  h2:
    font-size: 18
    break-before: always
  h3-font-size: 14
  h4-font-size: 13
  h5:
    font-size: 12
    margin-top: 6
  h6:
    font-size: 11
    margin-top: 0
    margin-left: 12
  margin-top: 18
  margin-bottom: 6
codespan:
  font-color: #333333
quote:
  font-size: 11
table:
  font-size: 10
  border-color: #cccccc
  border-width: [0.5, 0]
  grid-color: #dddddd
  grid-width: [0.25, 0]
  stripes: even
  head:
    font-style: bold
    font-color: #1a1a1a
    background-color: #f5f5f5
    border-bottom-width: 1
    border-bottom-color: #999999
  body:
    stripe-background-color: #fafafa
  cell:
    padding: [4, 6, 4, 6]
header:
  height: 15mm
  padding: [10mm, 0mm, 1mm, 0mm]
  border-width: 0.5
  border-color: #999999
  recto:
    right:
      content: '{page-number}'
    left:
      content: '{section-title}'
  verso:
    right:
      content: '{page-number}'
    left:
      content: '{chapter-title}'
footer:
  height: 15mm
  border-width: 0
  border-color: #999999
  text-transform: uppercase
  recto:
    right:
      content: ''
  verso:
    right:
      content: $footer-recto-right-content
    left:
      content: ''
title-page: false
cover:
  front:
    image: cover-page.pdf
sidebar:
  background-color: #e3f2fd
  border-color: #90caf9
  border-width: 0.5
  border-radius: 3
  padding: [6, 8, 6, 8]
example:
  background-color: #fdecea
  border-color: #ef9a9a
  border-width: 0.5
  border-radius: 3
  padding: [6, 8, 6, 8]
role:
  chat:
    font-size: 8
  chat-right:
    font-size: 8
    text-align: right
  chat-label:
    font-size: 9
    font-style: bold
  chat-label-right:
    font-size: 9
    font-style: bold
    text-align: right
  llm-judge-citation:
    font-size: 9
    font-style: italic
