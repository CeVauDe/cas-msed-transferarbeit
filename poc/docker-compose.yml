services:
  chatbot:
    build:
      context: .
      dockerfile: docker/chatbot/Dockerfile
    container_name: mcp-chatbot
    ports:
      - '7860:7860'
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - MCP_SERVER_URL=http://mcp-server-v2:8081/mcp
      - GRADIO_PORT=7860
      - GRADIO_ANALYTICS_ENABLED=False
    volumes:
      - ./apps/chatbot/src:/app/apps/chatbot/src:ro
    restart: on-failure
    depends_on:
      mcp-server-v2:
        condition: service_healthy

  mcp-server:
    build:
      context: .
      dockerfile: docker/mcp_server/Dockerfile
    container_name: mcp-server
    ports:
      - '8080:8080'
    environment:
      - MCP_SERVER_PORT=8080
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_TRANSPORT=streamable-http
      - MCP_SERVER_LOG_LEVEL=DEBUG
      - MCP_DEBUG_ENRICHMENT=false
      - MCP_DATA_PARQUET_PATH=/app/apps/mcp_server/data/Jahresbericht_all.parquet
    volumes:
      - ./apps/mcp_server/src:/app/apps/mcp_server/src:ro
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import socket; s=socket.create_connection(('127.0.0.1', 8080), 2); s.close()",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  mcp-server-v2:
    build:
      context: .
      dockerfile: docker/mcp_server_v2/Dockerfile
    container_name: mcp-server-v2
    ports:
      - '8081:8081'
    environment:
      - MCP_SERVER_V2_PORT=8081
      - MCP_SERVER_V2_HOST=0.0.0.0
      - MCP_SERVER_V2_TRANSPORT=streamable-http
      - MCP_DATA_V2_PARQUET_PATH=/app/apps/mcp_server/data/Jahresbericht_v2.parquet
    volumes:
      - ./apps/mcp_server/src:/app/apps/mcp_server/src:ro
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import socket; s=socket.create_connection(('127.0.0.1', 8081), 2); s.close()",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
