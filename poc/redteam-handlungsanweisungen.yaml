      strategyConfig:
        maxTurns: 5
        maxBacktracks: 5
    provider:
      id: promptfoo:redteam:crescendo
      config:
        injectVar: prompt
        maxTurns: 5
        maxBacktracks: 5
        redteamProvider: openai:chat:gpt-4o-mini
